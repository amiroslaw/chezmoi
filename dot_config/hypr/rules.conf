# scratchpads 
# workspace = special:special, gapsout:30
# IMPORTANT pin on doesn't work as I assumed 
windowrule {
  name = scratch-drop
  workspace = special:drop
  float = on
  # pin = on
  size = (monitor_w*0.9) (monitor_h*0.7)
  move = ((monitor_w*0.05)) (50)
  match:class = ^(drop)$
}

windowrule {
  name = scratch-chat
  workspace = special:chat
  float = on
  # pin = on
  # size = 900 700
  size = (monitor_w*0.6) (monitor_h*0.9)
  match:class = ^(chat)$
}

windowrule {
  name = scratch-news
  workspace = special:news
  float = on
  # pin = on
  size = (monitor_w*0.9) (monitor_h*0.8)
  match:class = ^(news)$
}

windowrule {
  name = scratch-music
  workspace = special:music
  float = on
  # pin = on
  center = no
  # move = (monitor_w-1100) 100
  size = 1000 (monitor_h*0.9)
  max_size = 1000 1000
  match:class = ^(music)$
}

windowrule {
  name = scratch-cal
  workspace = special:cal
  float = on
  # pin = on
  size = (monitor_w*0.8) (monitor_h*0.8)
  match:class = ^(cal)$
}

windowrule {
  name = task
