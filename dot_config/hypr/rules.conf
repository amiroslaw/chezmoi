## layer
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  order = -3
  match:namespace = notifications
}

# Rofi
layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0
  dim_around = on
  animation = popin 85%
  match:namespace = rofi
}

# layerrule = noanim, namespace:rofi
# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*
# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-31
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


