# windowrule v1 syntax is gone. windowrule now behaves like windowrule, deprecating the windowrule keyword
# windowrule v3 gives and option for named anonymous rules, anonymous == each rule on a different line for the same class name
# windowrule v3 allows many rules on one line for the same class name: windowrule = match:class KeePassXC, float on, size 333 333
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

