#{{{ ## INPUT ###
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

# idk
	# special_fallthrough = true
	# float_switch_override_focus = 2
    touchpad {
		middle_button_emulation = true
		tap-to-click = true
		clickfinger_behavior = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
# they don't work on my touchpad
	workspace_swipe_touch = true
	gesture = 3, vertical, workspace
	gesture = 3, left, dispatcher, movetoworkspacesilent e-1?
	gesture = 2, pinchin, resize
}

# Example per-device config Per-device config options will overwrite your options set in the input section.
# https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = mosart-semi.-trust-wireless-mouse
    sensitivity = 0.0
}
#}}} 

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
	force_split = 2 # spawn a window on the right side, 0 - follow the cursor
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master # a new window becomes the master
    # new_status = slave
}

source = ~/.config/hypr/look.conf
