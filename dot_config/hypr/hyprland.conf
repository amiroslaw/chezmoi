#{{{ ## KEYBINDINGS ###
# See https://wiki.hyprland.org/Configuring/Keywords/
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
$sup = SUPER

bindd = $sup CTRL, F1, Show keybindings, exec, "$XDG_CONFIG_HOME/hypr/hypr-keybinds.sh"
bindd = $sup SHIFT, F1, Show keybindings - update, exec, "$XDG_CONFIG_HOME/hypr/hypr-keybinds.sh" --update
bindd = $sup, Return, Open terminal, exec, $TERMINAL
bindd = $sup CTRL, Return, Open light terminal, exec, $TERM_LT
bindd = $sup, Q, Kill focused window, killactive,
bindd = $sup SHIFT, Q, Kill any queue job, exec, qu.clj kill-any

bindd = $sup, Space, Toggle floating mode, togglefloating,
bindd = $sup, backslash, Toggle split layout, togglesplit, # dwindle meh
# bind = $sup SHIFT, Space, pseudo, # dwindle meh
bindd = $sup, F, Fullscreen show bar, fullscreen, 1
bindd = $sup CTRL, F, Fullscreen without bar, fullscreen, 0

bindd = $sup, U, Focus urgent or last window, focusurgentorlast,
bindd = $sup, TAB, Last active workspace, workspace, previous
bindd = ALT, Tab, Cycle tiled windows, cyclenext, visible tiled
bindd = CTRL, Tab, Cycle all windows, cyclenext, visible floting

bindd = $sup, N, Next workspace, workspace, m+1
bindd = $sup, P, Previous workspace, workspace, m-1
bindd = $sup CTRL, N, Next empty workspace, workspace, empty:next
bindd = $sup CTRL, P, Previous empty workspace, workspace, empty:prev

bindd = $sup, H, Focus left, movefocus, l
bindd = $sup, J, Focus down, movefocus, d
bindd = $sup, K, Focus up, movefocus, u
bindd = $sup, L, Focus right, movefocus, r

# Tabbs/Groups
bindd = $sup, G, Toggle group, togglegroup
bindd = $sup CTRL, H, Move group left, movewindoworgroup, l
bindd = $sup CTRL, L, Move group right, movewindoworgroup, r
bindd = $sup CTRL, K, Move group up, movewindoworgroup, u
bindd = $sup CTRL, J, Move group down, movewindoworgroup, d
bindd = $sup SHIFT, H, Focus previous in group, changegroupactive, b
bindd = $sup SHIFT, L, Focus next in group, changegroupactive, f
# TODO check if it's a group and use movegroupwindow or moveactive
bindd = $sup SHIFT, K, Move group backward, movegroupwindow, b
bindd = $sup SHIFT, J, Move group forward, movegroupwindow, f

# bind = $sup SHIFT, J, swapnext,
# TODO movewindoworgroup does the same
# bind = $sup SHIFT, H, moveactive, l
# bind = $sup SHIFT, J, moveactive, d
# bind = $sup SHIFT, K, moveactive, u
# bind = $sup SHIFT, L, moveactive, r

bindd = $sup, 1, Switch to workspace 1, workspace, 1
bindd = $sup, 2, Switch to workspace 2, workspace, 2
bindd = $sup, 3, Switch to workspace 3, workspace, 3
bindd = $sup, 4, Switch to workspace 4, workspace, 4
bindd = $sup, 5, Switch to workspace 5, workspace, 5
bindd = $sup, 6, Switch to workspace 6, workspace, 6
bindd = $sup, 7, Switch to workspace 7, workspace, 7
bindd = $sup, 8, Switch to workspace 8, workspace, 8
bindd = $sup, 9, Switch to workspace 9, workspace, 9
bindd = $sup, 0, Switch to workspace 10, workspace, 10
bindd = $sup SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $sup SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $sup SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $sup SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $sup SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $sup SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $sup SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $sup SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $sup SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $sup SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
# or binde to SHIFT hjkl
bindd = $sup, right, Resize right, resizeactive, 10% 0%
bindd = $sup, left, Resize left, resizeactive, -10% 0%
bindd = $sup, down, Resize down, resizeactive, 0% 10%
bindd = $sup, up, Resize up, resizeactive, 0% -10%

bindm = $sup, mouse:272, Move window with mouse
bindm = $sup, mouse:273, Resize window with mouse

# Scroll through existing workspaces with mainMod + scroll
bindd = $sup, mouse_down, Scroll workspace forward, workspace, e+1
bindd = $sup, mouse_up, Scroll workspace backward, workspace, e-1

# double_click but it had to be in floting mode in order to have sense
# bind = , mouse:272, exec, sleep 0.2 && hyprctl dispatch submap reset
# bind = , mouse:272, submap, double_click
# submap = double_click
# bind = , mouse:272, togglefloating,
# submap = reset
# bindc = , mouse:273, togglefloating
# LMB -> 272
# RMB -> 273

# Laptop multimedia keys for volume and LCD brightness
# bind = $sup, Plus, exec, pactl set-sink-volume "$(pacmd list-sinks | grep '* index' | awk '{print $3}')" +15%
# bind = $sup SHIFT, Minus, exec, pactl set-sink-volume "$(pacmd list-sinks | grep '* index' | awk '{print $3}')" -15%
binddel = $sup, Equal, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binddel = $sup, Minus, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddl = $sup, Slash, Toggle mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddl = $sup SHIFT, Slash, Toggle headset, exec, audio.sh toggle
bindd = $sup CONTROL, Slash, Manage audio devices, exec, audio.sh
binddel = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binddel = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddl = ,XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddl = ,XF86AudioMicMute, Mic mute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binddel = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl -e4 -n2 set 5%+
binddel = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
# bindl = $sup, M, exec, mpc toggle
# bindl = $sup, Comma, exec, mpc prev
# bindl = $sup, Period, exec, mpc next
binddl = $sup, M, Play/pause media, exec, playerctl play-pause
binddl = $sup, Comma, Previous track, exec, playerctl previous
binddl = $sup, Period, Next track, exec, playerctl next
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous
binddl = , XF86AudioPause, Pause, exec, playerctl play-pause
binddl = , XF86AudioPlay, Play, exec, playerctl play-pause
#}}}

#{{{ ## APPS
