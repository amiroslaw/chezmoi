#{{{ ## INPUT ###
# https://wiki.hyprland.org/Configuring/Variables/#input
input {
	numlock_by_default = true
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
	scroll_method = 2fg #edge
# idk
	# special_fallthrough = true
	# float_switch_override_focus = 2
    touchpad {
		scroll_factor = 0.7
		middle_button_emulation = true
		tap-to-click = true
		clickfinger_behavior = false
    }
}


# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
# they don't work on my touchpad
	workspace_swipe_touch = true
	# gesture = 2, vertical, mod:ALT, workspace
	# gesture = 2, down, dispatcher, exec, foot
	# gesture = 3, left, dispatcher, movetoworkspacesilent e-1?
	# gesture = 2, pinchin, resize
}

# Example per-device config Per-device config options will overwrite your options set in the input section.
# https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# 1 for the left button, 2 for the middle button (pressing the scroll wheel), and 3 for the right button
# sensitivity range -1.0 to 1.0
# hyprctl devices
device {
    name = mosart-semi.-trust-wireless-mouse
    sensitivity = 0.0
}
# scroll with left + right button clicked 
# seems redundant
device {
	name = kensington-usb-orbit
    sensitivity = 1.0
    middle_button_emulation = true
    scroll_button = 3
    scroll_button_lock = false # turn off on scroll
}
device {
	name = logitech-mx-vertical-1
    sensitivity = 1.0
}
#}}} 

# layout is set in look.config
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
	force_split = 2 # spawn a window on the right side, 0 - follow the cursor
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master # a new window becomes the master
    # new_status = slave
}

binds {
# TODO check it out 
    # allow_workspace_cycles = true
	# workspace_back_and_forth = true
# fix popups? 
	# allow_pin_fullscreen = true 
    drag_threshold = 10  # Fire a mouse drag event only after dragging for more than 10px
}

debug {
	disable_logs = false
}

source = ~/.config/hypr/look.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/monitor.conf
