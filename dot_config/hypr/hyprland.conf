bindd = $sup SHIFT, Escape, Restore notifications, exec, makoctl restore

bindd = $sup, F1, Run browser, exec, $BROWSER
bindd = $sup, F2, Run IntelliJ IDEA, exec, /opt/idea-IU-212.5284.40/bin/idea.sh
