# Configuration documentation is available at https://dystroy.org/broot
# internal - overrite shortcut
# todo more preview_transformers

[[preview_transformers]]
input_extensions = [ "pdf" ]
output_extension = "png"
mode = "image"
command = [ "mutool", "draw", "-w", "1000", "-o", "{output-path}", "{input-path}" ]

[[preview_transformers]]
input_extensions = [ "xls", "xlsx", "doc", "docx", "ppt", "pptx", "ods", "odt", "odp" ]
output_extension = "png"
mode = "image"
command = [ "libreoffice", "--headless", "--convert-to", "png", "--outdir", "{output-dir}", "{input-path}" ]

# enable_kitty_keyboard = false
#####################
icon_theme = "nerdfont"
# Skin
imports = [
  { luma = "dark", file = "skins/catppuccin-macchiato.hjson" },
  { luma = "light", file = "skins/white.hjson" }
]

# modal = true

####################
# verbs
# files aren't open in $EDITOR 

[[verbs]]
invocation = "edit"
shortcut = "e"
key = "ctrl-e"
apply_to = "text_file"
# execution = "$EDITOR {file}"
execution = "/usr/bin/nvim {file}"
leave_broot = false

[[verbs]]
key = "ctrl-o"
shortcut = "f"
invocation = "open_stay_filter"
internal = ":open_stay_filter"

[[verbs]]
key = "ctrl-s"
invocation = "stage"
# with toggle_stage it loops
cmd = ":stage;:line_down"
[[verbs]]
key = "alt-s"
invocation = "toggle_stage"
internal= ":toggle_stage"
[[verbs]]
key = "ctrl-z"
invocation = "stage_all"
internal = ":stage_all_files"
[[verbs]]
key = "ctrl-x"
invocation = "print_relative"
cmd = ":panel_right;:print_relative_path"
[[verbs]]
key = "alt-x"
invocation = "print_absolute"
cmd = ":panel_right;:pp"
# [[verbs]]
# key = "ctrl-x"
# invocation = "clear_stage"
# internal = ":clear_stage"

