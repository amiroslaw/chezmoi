##### SORT
[[verbs]]
key = "alt-g"
internal = "toggle_sizes"
[[verbs]]
key = "F10"
invocation="sort_by_size"
internal = ":sort_by_size"
[[verbs]]
key = "F11"
invocation="sort_by_date"
internal = ":sort_by_date"
[[verbs]]
key = "F12"
invocation="sort_by_type"
internal = ":sort_by_type"

##### EXECUTION
[[verbs]]
invocation = "remove"
key = "ctrl-r"
# keys = ["ctrl-r", "delete"]
leave_broot = false
execution = "gomi {file}"
# execution = "trash-put {file}"
# or {directory} it not match dir or file it will delete parrent!
# execution = "rm -rf {file}"
[[verbs]]
key = "F1"
invocation = "refresh"
internal = ":refresh"
[[verbs]]
key = "F5"
invocation = "copy_to_panel"
execution = "cp -r {file} {other-panel-directory}"
leave_broot = false
# internal = ":cpp" can't be overrited 
[[verbs]]
name = "move"
key = "F6"
invocation = "move_to_panel"
execution = "mv {file} {other-panel-directory}"
leave_broot = false
# internal = ":move_to_panel" can't be overrited 
[[verbs]]
name = "mkdir"
key = "F7"
invocation = "mkdir {new_dir}"
execution = "/bin/mkdir -p {directory}/{new_dir}"
leave_broot = false
auto_exec = false
# execution = "mkdir -p {subpath:path-from-directory}"
[[verbs]]
name = "touch"
key = "F8"
invocation = "touch {new_file}"
execution = "touch {directory}/{new_file}"
leave_broot = false
auto_exec = false

# todo - probably I have different difftool than meld
[[verbs]]
invocation = "diff"
external = "git difftool -y {file}"
leave_broot = false

# BOOKMARKS
[[verbs]]
invocation = "home"
key = "alt-h"
internal = ":focus ~/"

